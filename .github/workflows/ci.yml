name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # testdata holds source fixtures whose recorded fragments pin their
      # exact layout, so they stay as written.
      - name: gofmt
        run: |
          out="$(gofmt -l $(git ls-files '*.go' | grep -v '/testdata/'))"
          test -z "$out" || { echo "$out"; exit 1; }
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Also part of the full run below. Named so a breach reads as the import
      # guard in the PR checks, and run on its own with -count=1 so a cached
      # pass never hides a new import.
      - name: Import guard
        run: go test -count=1 -v ./internal/importguard/
      # Also part of the full run. Fails when a file holds a rule id or message
      # of a private ruleset (internal/rulesetguard).
      - name: Ruleset content guard
        run: go test -count=1 -v ./internal/rulesetguard/
      - name: Test
        run: go test -race ./...
